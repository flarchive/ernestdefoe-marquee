ernestdefoe-marquee:
  admin:
    permissions:
      link_own: Modifier le titre lié de leurs propres discussions
      link_any: Modifier le titre lié de n’importe quelle discussion
    tmdb_token_label: Jeton d'accès en lecture de l'API TMDB
    tmdb_token_help: "Les films et les séries viennent de The Movie Database. <a>Créez un jeton dans les paramètres API de TMDB</a> et collez ici le long API Read Access Token. Il reste sur le serveur."
    igdb_label: Identifiants d'application Twitch pour IGDB
    igdb_help: "Les jeux viennent d'IGDB, géré par Twitch. <a>Enregistrez une application dans la console développeur Twitch</a> (Twitch exige d'abord l'authentification à deux facteurs sur votre compte ; type de client Confidential, URL de redirection https://localhost), créez un secret client, puis collez les deux ici. Le secret reste sur le serveur. IGDB est gratuit pour les forums non commerciaux ; un forum commercial a besoin d'un partenariat avec IGDB."
    igdb_client_id: Client ID
    igdb_client_secret: Secret client
    deepl_label: Clé API DeepL (facultative)
    deepl_help: "Les descriptions de jeux viennent de Wikipédia dans la langue des données quand il a le jeu. Le reste des données de jeux d'IGDB et la plupart des résumés de livres d'Open Library sont en anglais. Avec une clé DeepL, Marquee traduit les résumés des jeux et des livres et les sujets des livres dans la langue des données (les genres et modes de jeu sont traduits par les fichiers de langue du forum), une fois par titre, et garde la traduction. <a>Obtenez une clé API DeepL gratuite</a> : l'offre gratuite traduit 500 000 caractères par mois, assez pour des milliers de titres. La clé reste sur le serveur."
    language_label: Langue des données
    language_help: "La langue des titres, résumés et genres des films et séries, sous forme de code comme fr, fr-FR ou pt-BR. Laissez vide pour suivre la langue par défaut du forum. Les données de jeux d'IGDB sont en anglais (seuls des noms japonais et coréens existent) : les descriptions de jeux viennent de Wikipédia dans cette langue quand il a le jeu, et le reste est traduit avec une clé DeepL ; les albums gardent les titres des artistes, et les titres, couvertures et éditeurs des livres la suivent quand Open Library a une édition dans cette langue (les résumés de livres sont surtout en anglais). Les titres déjà liés changent de langue à leur prochaine mise à jour."
    language_placeholder: "La langue du forum"
    list_posters_label: Afficher les affiches dans la liste des discussions
    list_posters_help: "Une petite affiche à côté de chaque discussion liée. Désactivez-la si une autre extension, comme FoF Discussion Thumbnail, affiche déjà des miniatures."
    title_year_label: Ajouter l'année aux titres
    title_year_help: "Les titres des discussions et la carte affichent « Final Fantasy VII Remake (2020) ». Désactivez pour « Final Fantasy VII Remake » ; la carte affiche toujours la date. S'applique aux titres liés à partir de maintenant ; les titres de discussions existants gardent leur année jusqu'à ce qu'ils soient renommés."
    list_meta_label: Ce que la liste des discussions affiche sous une discussion liée
    list_meta_help: "Affiché à côté de la ligne de l'auteur. Le code d'une saison ou d'un épisode de série (Saison 2, S03E03) s'affiche avec les deux premiers choix."
    list_meta_kind_year: "Type et année (Jeu · 2026)"
    list_meta_year: "Année seulement (2026)"
    list_meta_none: Rien
    show_scores_label: Afficher les notes sur la fiche
    show_scores_help: "Notes des utilisateurs TMDB, notes de la critique et des membres IGDB et notes Open Library, sur la fiche, les saisons et les épisodes."
    show_source_link_label: "Afficher le bouton « Voir sur TMDB / IGDB… »"
    show_source_link_help: "Le bouton sous la fiche qui ouvre le titre sur sa source. La petite ligne d'attribution (« Données de jeu d'IGDB.com », la mention de TMDB) reste toujours affichée : TMDB exige sa mention et les conditions d'IGDB demandent de le citer."
    tags_label: Quelles étiquettes utilisent quelle source
    tags_help: "Quand quelqu'un ouvre une discussion sous l'une de ces étiquettes, le champ du titre cherche dans cette source et la discussion affiche la fiche du titre dans son en-tête. Les autres étiquettes gardent l'éditeur habituel."
    source_none: Discussion normale
    source_movie: Films (TMDB)
    source_tv: Séries (TMDB)
    source_game: Jeux (IGDB)
    source_music: Albums de musique (Deezer, sans clé)
    source_book: Livres (Open Library, sans clé)

  api:
    link_invalid: Ce titre n'a pas pu être lié. Choisissez-le de nouveau dans la liste.
    link_unavailable: La source du titre ne répond pas, le titre n'a donc pas été lié. Réessayez dans un instant.

